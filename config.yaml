# Configuração do bot de ofertas (o que não é segredo fica aqui; segredos vão no .env)

geral:
  # PRODUÇÃO: 1 oferta por grupo a cada 40 min, das 8h às 23h (~22/dia por grupo).
  # Se muita gente sair dos grupos, aumente (as fontes pesquisadas indicam 4 a 8/dia).
  # Para testar rápido, use intervalo_minutos: 1 e horario_ativo: "".
  intervalo_minutos: 40        # de quanto em quanto tempo buscar ofertas novas (comando "run")
  max_posts_por_ciclo: 1       # ofertas enviadas POR GRUPO a cada ciclo
  espacamento_segundos: 15     # pausa entre um envio e outro no WhatsApp (mesmo de grupos diferentes)
  nao_repetir_dias: 7          # não reenviar o mesmo produto ao mesmo grupo dentro desse prazo
  horario_ativo: "08:00-23:00" # só envia nesse intervalo; "" = 24h

filtros:
  desconto_minimo: 10          # % mínimo de desconto
  preco_minimo: 0              # 0 = sem limite
  preco_maximo: 0              # 0 = sem limite
  # itens masculinos que aparecem em Beleza (barbear) e Moda Íntima/Praia
  palavras_bloqueadas: [masculino, masculina, barbeador, barbear, barba, aparador, acabamento, kemei, cueca, sunga]

fontes:
  mercadolivre:
    ativa: true
    site: MLB                  # MLB = Brasil
    # modo: auto = mais vendidos da API + página de ofertas do ML (recomendado)
    #       api = só API | pagina = só a página mercadolivre.com.br/ofertas
    modo: auto
    limite_por_busca: 50       # itens pedidos à API por busca/categoria (máx. 50)
    limite_destaques: 20       # se a busca da API for bloqueada: mais vendidos por categoria
    subcategorias_por_busca: 2 # mais vendidos: quantas (sub)categorias consultar por vez, em rodízio
    paginas_ofertas: 1         # páginas de mercadolivre.com.br/ofertas lidas por vez (~48 promoções cada)
    paginas_ofertas_max: 10    # rodízio: vai da página 1 até esta e recomeça

# Grupos de destino. "whatsapp" = nome EXATO do grupo no WhatsApp do número do bot
# (liste os nomes com o LOGIN_WHATSAPP.bat ou: uv run python -m ofertas whatsapp-grupos).
# A cada ciclo, cada grupo recebe max_posts_por_ciclo oferta(s), alternando as
# categorias do grupo (rodízio). Para criar um grupo, copie um bloco e ajuste.
# categorias: lista de ids [MLB1246, ...] ou "id: nome" (o nome aparece no log).
grupos:
  mulher:
    nome: Achadinhos da Mulher 💄
    categorias:
      MLB1246: Beleza e Cuidado Pessoal
      MLB108704: Vestidos
      MLB3112: Blusas
      MLB278018: Leggings
    whatsapp: "Achadinhos da Mulher 💄"
    # link de convite que vai no fim de cada oferta ("Envie essa oferta para uma amiga!").
    # Troque o texto entre colchetes pelo link (https://chat.whatsapp.com/...), entre aspas.
    convite: "https://chat.whatsapp.com/IDNfRoNrDxI5rw7ZAlVEVK?mode=gi_t"
  bebe:
    nome: Achadinhos Mamãe e Bebê 🍼
    categorias:
      MLB1384: Bebês
      MLB5366: Roupas para Bebês
      MLB1132: Brinquedos e Hobbies
    whatsapp: "Achadinhos Mamãe e Bebê 🍼"
    convite: "https://chat.whatsapp.com/IzxfbYBYqUdBa8Y2OkhJ5M?mode=gi_t"

# Categorias do Mercado Livre:
#   MLB1648 Informática             MLB1000 Eletrônicos, Áudio e Vídeo
#   MLB1051 Celulares e Telefones   MLB1144 Games
#   MLB1574 Casa, Móveis e Decoração MLB5726 Eletrodomésticos
#   MLB1276 Esportes e Fitness      MLB1430 Calçados, Roupas e Bolsas
#   MLB1246 Beleza e Cuidado Pessoal MLB264586 Saúde
#   MLB1132 Brinquedos e Hobbies    MLB1384 Bebês
#   MLB1071 Animais                 MLB5672 Acessórios para Veículos
#   MLB1500 Construção              MLB263532 Ferramentas
#   MLB1196 Livros, Revistas e Comics
# Subcategorias de moda (dentro de MLB1430 Calçados, Roupas e Bolsas):
#   MLB108704 Vestidos   MLB3112 Blusas   MLB185489 Saias   MLB278018 Leggings
#   MLB27250 Macacão     MLB270215 Moda Fitness   MLB430391 Moda Praia
#   MLB108786 Moda Íntima e Lingerie   MLB1457 Malas e Bolsas   MLB5366 Roupas para Bebês

# Para onde as ofertas vão:
#   console  = só mostra no terminal e salva em data/saida.jsonl (testes)
#   whatsapp = envia foto + legenda para os grupos (Evolution API no Docker)
destino: whatsapp
