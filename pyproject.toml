[project]
name = "bot-ofertas-whatsapp"
version = "0.1.0"
description = "Busca ofertas do Mercado Livre via API oficial e envia para um grupo de WhatsApp"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
